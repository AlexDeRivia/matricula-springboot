<div th:fragment="iHtml(tipo, label, ph, campo)" class="form-field" th:classappend="${#fields.hasErrors(campo)} ? ' has-error' : ''">
    <label th:if="${tipo != 'hidden'}" th:for="${'input' + campo}" th:text="${label}">Etiqueta</label>
    <input th:type="${tipo}" th:id="${'input' + campo}" th:placeholder="${ph}"
           th:field="*{__${campo}__}" th:attr="aria-invalid=${#fields.hasErrors(campo)}" class="form-control">
    <small th:if="${#fields.hasErrors(campo)}" class="field-error" th:errors="*{__${campo}__}"></small>
</div>

<th:block th:fragment="btn_agregar(ruta, texto)">
    <a th:href="${ruta}" class="btn btn-primary" th:text="${texto}"></a>
</th:block>

<th:block th:fragment="btn_cerrar">
    <a th:href="@{/}" class="btn btn-outline-secondary">Volver al inicio</a>
</th:block>

<th:block th:fragment="btn_aceptar">
    <button type="submit" class="btn btn-primary" data-loading-label="Guardando…">Guardar cambios</button>
</th:block>

<th:block th:fragment="btn_cancelar(ruta)">
    <a th:href="${ruta}" class="btn btn-outline-secondary">Cancelar</a>
</th:block>

<th:block th:fragment="btn_editar(ruta)">
    <a th:href="${ruta}" class="btn btn-outline-warning btn-sm">Editar</a>
</th:block>

<th:block th:fragment="btn_eliminar(ruta)">
    <form th:action="${ruta}" method="post" class="d-inline">
        <button type="submit" class="btn btn-outline-danger btn-sm">Eliminar</button>
    </form>
</th:block>
