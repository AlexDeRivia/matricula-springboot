<head th:fragment="site-head">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#dedede">
    <title>Control Académico</title>
    <link rel="icon" th:href="@{/images/icono-app.png}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/interface.css}">
    <script defer th:src="@{/js/bootstrap.bundle.js}"></script>
    <script defer th:src="@{/js/interface.js}"></script>
</head>

<header th:fragment="site-header" class="site-header">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div class="site-header-inner">
        <a class="brand" th:href="@{/}" aria-label="Control Académico, inicio">
            <span class="brand-name">Control<br><strong>Académico</strong></span>
            <span class="brand-note">Matrícula y notas</span>
        </a>
        <button class="nav-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#primaryNav"
                aria-controls="primaryNav" aria-expanded="false" aria-label="Abrir menú">
            <span></span><span></span>
        </button>
        <div class="collapse site-navigation" id="primaryNav">
            <nav class="site-nav" aria-label="Navegación principal">
                <a th:href="@{/alumno/index}">Alumnos</a>
                <a th:href="@{/curso/index}">Cursos</a>
                <a th:href="@{/docente/index}">Docentes</a>
            </nav>
            <div class="session-tools" sec:authorize="isAuthenticated()">
                <div class="session-identity"><span class="session-name" sec:authentication="name">Usuario</span><span class="session-role" sec:authorize="hasRole('ADMIN')">Puede editar</span><span class="session-role" sec:authorize="hasRole('VIEWER')">Solo lectura</span></div>
                <form th:action="@{/logout}" method="post"><button type="submit" class="session-exit">Cerrar sesión</button></form>
            </div>
            <a class="session-login" th:href="@{/usuario/login}" sec:authorize="!isAuthenticated()">Iniciar sesión</a>
        </div>
    </div>
    <div class="global-notice" th:if="${success}" role="status" th:text="${success}"></div>
    <div class="global-notice global-notice--error" th:if="${error}" role="alert" th:text="${error}"></div>
</header>
