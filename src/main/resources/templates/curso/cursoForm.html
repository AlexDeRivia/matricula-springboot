<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_frag/Base::site-head}"></head>
<body>
<header th:replace="~{_frag/Base::site-header}"></header>
<main id="contenido" class="page-shell page-enter">
    <div class="page-topline"><div><h1 class="page-title" th:text="${curso.id == null ? 'Nuevo curso' : 'Editar curso'}"></h1></div><a class="back-link" th:href="@{/curso/index}">Volver a cursos</a></div>
    <div class="form-shell">
        <aside class="form-aside"><h2>Datos del curso</h2><p>Define el nombre, la carga de créditos y el docente responsable.</p></aside>
        <form class="form-sheet" th:object="${curso}" th:action="@{/curso/guardar}" method="post" data-progress novalidate>
            <input type="hidden" th:field="*{id}">
            <div class="form-alert" th:if="${#fields.hasErrors('*')}" role="alert"><strong>Revisa los campos señalados.</strong>Corrige los datos y vuelve a guardar.</div>
            <div class="form-grid">
                <div class="form-field--full"><div th:replace="~{_frag/Inputs::iHtml('text', 'Nombre del curso', 'Nombre', 'nombre')}"></div></div>
                <div th:replace="~{_frag/Inputs::iHtml('number', 'Créditos', 'Créditos', 'creditos')}"></div>
                <div class="form-field" th:classappend="${#fields.hasErrors('docente')} ? ' has-error' : ''">
                    <label for="selectDocente">Docente responsable</label>
                    <select id="selectDocente" name="docente.id" class="form-select" th:attr="aria-invalid=${#fields.hasErrors('docente')}">
                        <option value="">Selecciona un docente</option>
                        <option th:each="oDocente : ${listaDocentes}" th:value="${oDocente.id}" th:text="${oDocente.apellidos} + ', ' + ${oDocente.nombres}" th:selected="${oDocente.id} == ${curso.docente.id}"></option>
                    </select>
                    <small class="field-error" th:if="${#fields.hasErrors('docente')}" th:errors="*{docente}"></small>
                </div>
            </div>
            <div class="form-actions"><button type="submit" class="btn btn-primary" data-loading-label="Guardando…">Guardar curso</button><a class="btn btn-outline-secondary" th:href="@{/curso/index}">Cancelar</a></div>
        </form>
    </div>
</main>
<footer th:replace="~{_frag/Base::site-footer}"></footer>
</body>
</html>
