<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_frag/Base::site-head}"></head>
<body>
<header th:replace="~{_frag/Base::site-header}"></header>
<main id="contenido" class="page-shell page-enter">
    <div class="page-topline"><div><h1 class="page-title">Calificar curso</h1><p class="page-subtitle" th:text="${alumno.apellido} + ', ' + ${alumno.nombre} + ' — ' + ${curso.nombre}"></p></div><a class="back-link" th:href="@{/nota/boleta/{id}(id=${alumno.id})}">Volver a boleta</a></div>
    <div class="form-shell">
        <aside class="form-aside"><h2>Una nota por unidad</h2><p>Usa valores entre 0 y 20. Puedes dejar una unidad pendiente; el promedio aparece cuando se completan las tres.</p></aside>
        <form class="form-sheet" th:object="${calificacion}" th:action="@{/nota/calificar/{alumno}/{curso}(alumno=${alumno.id},curso=${curso.id})}" method="post" data-progress novalidate>
            <div class="form-alert" th:if="${#fields.hasErrors('*')}" role="alert"><strong>Revisa las notas.</strong>Cada valor debe estar entre 0 y 20.</div>
            <div class="form-grid">
                <div class="form-field" th:each="unidad : ${#numbers.sequence(1, 3)}" th:classappend="${#fields.hasErrors('unidad' + unidad)} ? ' has-error' : ''">
                    <label th:for="${'unidad' + unidad}" th:text="${'Unidad ' + unidad}"></label>
                    <input th:id="${'unidad' + unidad}" th:field="*{__${'unidad' + unidad}__}" type="number" min="0" max="20" step="0.01" class="form-control" th:attr="aria-invalid=${#fields.hasErrors('unidad' + unidad)}">
                    <small class="field-error" th:if="${#fields.hasErrors('unidad' + unidad)}" th:errors="*{__${'unidad' + unidad}__}"></small>
                </div>
            </div>
            <div class="form-actions"><button type="submit" class="btn btn-primary" data-loading-label="Guardando…">Guardar notas</button><a class="btn btn-outline-secondary" th:href="@{/nota/boleta/{id}(id=${alumno.id})}">Cancelar</a></div>
        </form>
    </div>
</main>
</body>
</html>
