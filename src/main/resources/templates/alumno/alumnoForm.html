<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_frag/Base::site-head}"></head>
<body>
<header th:replace="~{_frag/Base::site-header}"></header>
<main id="contenido" class="page-shell page-enter">
    <div class="page-topline"><div><h1 class="page-title" th:text="${alumno.id == null ? 'Nuevo alumno' : 'Editar alumno'}"></h1></div><a class="back-link" th:href="@{/alumno/index}">Volver a alumnos</a></div>
    <div class="form-shell">
        <aside class="form-aside"><h2>Datos del alumno</h2><p>Completa la información de identidad y contacto. El promedio se calcula automáticamente desde las calificaciones.</p></aside>
        <form class="form-sheet" th:object="${alumno}" th:action="@{/alumno/guardar}" method="post" data-progress novalidate>
            <input type="hidden" th:field="*{id}">
            <div class="form-alert" th:if="${#fields.hasErrors('*')}" role="alert"><strong>Revisa los campos señalados.</strong>Corrige los datos y vuelve a guardar.</div>
            <div class="form-grid">
                <div th:replace="~{_frag/Inputs::iHtml('text', 'Apellidos', 'Apellidos', 'apellido')}"></div>
                <div th:replace="~{_frag/Inputs::iHtml('text', 'Nombres', 'Nombres', 'nombre')}"></div>
                <div th:replace="~{_frag/Inputs::iHtml('text', 'DNI', '8 dígitos', 'dni')}"></div>
                <div th:replace="~{_frag/Inputs::iHtml('date', 'Fecha de nacimiento', '', 'fechaNacimiento')}"></div>
                <div th:replace="~{_frag/Inputs::iHtml('tel', 'Celular', '9 dígitos', 'celular')}"></div>
                <div th:replace="~{_frag/Inputs::iHtml('email', 'Correo electrónico', 'nombre@ejemplo.com', 'eMail')}"></div>
                <div class="form-field--full"><div th:replace="~{_frag/Inputs::iHtml('text', 'Dirección', 'Dirección del alumno', 'direccion')}"></div></div>
            </div>
            <div class="form-actions"><button type="submit" class="btn btn-primary" data-loading-label="Guardando…">Guardar alumno</button><a class="btn btn-outline-secondary" th:href="@{/alumno/index}">Cancelar</a></div>
        </form>
    </div>
</main>
</body>
</html>
